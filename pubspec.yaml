name: timeproof
description: "TimeProof - Dokumentasi kehadiran & aktivitas kerja dengan bukti foto bertimestamp, lokasi, koordinat, dan kode verifikasi."
publish_to: "none"
version: 2.0.0+3000

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0+2

  # Location & geocoding (native Android geocoder = gratis, tanpa API berbayar)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Manual location picker — OpenStreetMap (flutter_map), TANPA API key.
  # Bisa drag peta & pilih titik; murni Dart (tidak ada plugin native).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Pencarian lokasi by nama via Nominatim (OSM) — gratis, tanpa API key.
  http: ^1.2.2

  # Import foto dari galeri
  image_picker: ^1.1.2

  # Files & paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Simpan ke galeri (/DCIM/TimeProof) - mendukung scoped storage Android 10+
  gal: ^2.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Verification code
  uuid: ^4.5.1

  # Settings storage
  shared_preferences: ^2.3.2

  # Local database (PhotoHistory)
  sqflite: ^2.3.3+1

  # Encode JPEG final (kontrol kualitas 80/90/95% & ukuran file)
  image: ^4.2.0

  # SHA256 hash integritas foto (anti-ubah)
  crypto: ^3.0.5

  # Auto-update: versi app saat ini + buka installer APK pembaruan
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  # Deteksi arsitektur (ABI) agar unduh APK varian yang cocok
  device_info_plus: ^10.0.0

  # Format tanggal Indonesia (id_ID)
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2

# Ikon aplikasi dari Logo.png
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_bg.png"
  adaptive_icon_foreground: "assets/icon/logo_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/branding/
  # Font di-bundle agar overlay konsisten di semua HP (tidak ikut font sistem
  # seperti MiSans di Xiaomi). Variable font: bobot diatur via fontWeight.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
